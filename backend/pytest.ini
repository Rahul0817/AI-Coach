[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# `auto` means async tests need no per-test decorator, which removes a whole
# class of "the test passed because it never actually ran" mistakes.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

addopts =
    -ra
    --strict-markers
    --strict-config
    --tb=short

markers =
    unit: pure logic, no database or network
    integration: exercises the database
    api: drives HTTP endpoints through the app
    slow: takes more than a second

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
