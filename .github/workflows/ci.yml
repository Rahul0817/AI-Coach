name: CI

on:
  push:
    branches: ["main", "develop", "claude/**"]
  pull_request:
    branches: ["main", "develop"]
  workflow_dispatch:

# A new push to the same branch cancels the previous run. Without this, a
# series of quick pushes queues several full matrix builds that nobody will
# read the results of.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22"

jobs:
  # ---------------------------------------------------------------- lint --
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install tooling
        working-directory: backend
        run: pip install ruff mypy

      - name: Ruff (lint)
        working-directory: backend
        run: ruff check app ml tests

      - name: Ruff (format check)
        working-directory: backend
        run: ruff format --check app ml tests

      - name: mypy
        working-directory: backend
        # Not blocking yet: the codebase is progressively typed, and failing CI
        # on every un-annotated third-party boundary would train people to
        # ignore the job. Tracked to become blocking.
        continue-on-error: true
        run: mypy app --ignore-missing-imports --no-strict-optional

  # ---------------------------------------------------------------- test --
  test:
    name: Backend tests
    runs-on: ubuntu-latest

    # Real Postgres and Redis rather than mocks. The suite runs against SQLite
    # by default for speed, but CI also proves the app works on the database it
    # actually ships with — dialect differences (JSONB, uuid, transactional
    # DDL) are exactly what a SQLite-only suite cannot catch.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: oviora
          POSTGRES_PASSWORD: oviora_test
          POSTGRES_DB: oviora_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U oviora -d oviora_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr poppler-utils

      - name: Install Python dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Train the risk model
        working-directory: backend
        # The prediction tests need a real artifact. Training takes ~30s, which
        # is cheaper and far more honest than committing a binary model file.
        run: python -m ml.train --rows 4000

      - name: Verify migrations apply and reverse
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://oviora:oviora_test@localhost:5432/oviora_test
        run: |
          python -m alembic upgrade head
          python -m alembic downgrade base
          python -m alembic upgrade head

      - name: Check for un-migrated model changes
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://oviora:oviora_test@localhost:5432/oviora_test
        # Catches the most common schema bug: a model edited without a matching
        # migration. Autogenerate against a migrated database must find nothing.
        run: |
          python -m alembic revision --autogenerate -m "drift check" -q
          if grep -qE "op\.(create|drop|alter|add)" alembic/versions/*drift_check.py; then
            echo "::error::Models have changed without a migration. Run: alembic revision --autogenerate"
            cat alembic/versions/*drift_check.py
            exit 1
          fi
          rm -f alembic/versions/*drift_check.py

      - name: Run tests
        working-directory: backend
        env:
          ENVIRONMENT: development
          SECRET_KEY: ci-secret-key-not-used-anywhere-real-0123456789abcdef
          REDIS_HOST: localhost
          LLM_PROVIDER: local
          EMBEDDING_PROVIDER: local
        run: |
          pytest tests -v --cov=app --cov=ml \
            --cov-report=xml --cov-report=term-missing \
            --junitxml=junit.xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage.xml
          retention-days: 7

  # ------------------------------------------------------------ frontend --
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Type-check
        working-directory: frontend
        run: npm run typecheck

      - name: Build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build

  # ------------------------------------------------------------- security --
  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Audit Python dependencies
        working-directory: backend
        run: |
          pip install pip-audit
          # Non-blocking: a new CVE in a transitive dependency should raise a
          # flag, not break an unrelated pull request at 5pm on a Friday.
          pip-audit -r requirements.txt --desc || true

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # --------------------------------------------------------------- docker --
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: true
          tags: oviora-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the image
        # Proves the image starts and serves, which a build alone does not.
        run: |
          # Generated at runtime rather than written into the file. A literal
          # high-entropy string here is indistinguishable from a real leaked
          # key to a secret scanner, and a scanner people learn to ignore is
          # worse than no scanner.
          docker run -d --name oviora-smoke -p 8000:8000 \
            -e SECRET_KEY="$(openssl rand -hex 32)" \
            -e ENVIRONMENT=development \
            -e LLM_PROVIDER=local \
            oviora-api:ci
          for attempt in $(seq 1 30); do
            if curl -sf http://localhost:8000/health/live; then
              echo "container is serving"; exit 0
            fi
            sleep 2
          done
          echo "::error::container failed to become healthy"
          docker logs oviora-smoke
          exit 1

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: oviora-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
